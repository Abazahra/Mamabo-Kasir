<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Katalog MAMBO</title><link rel="stylesheet" href="styles.css"><style>
body{background:var(--bg,#f4f6fa)}.catalog-wrap{max-width:1100px;margin:auto;padding:22px}.catalog-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.catalog-brand{display:flex;align-items:center;gap:12px}.catalog-brand .brand-mark{width:48px;height:48px}.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.catalog-card{background:var(--panel,#fff);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}.catalog-photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:11px;background:#eef1f5}.catalog-placeholder{aspect-ratio:1/1;display:grid;place-items:center;background:#eef1f5;border-radius:11px;color:#667085}.catalog-card h3{font-size:15px;margin:0}.catalog-category{font-size:12px;color:var(--muted)}.catalog-price{font-weight:800;color:var(--accent);font-size:17px}.catalog-card button{margin-top:auto}.catalog-toolbar{display:flex;gap:10px;margin:14px 0}.catalog-toolbar input,.catalog-toolbar select{min-width:0;flex:1}.catalog-cart{position:sticky;bottom:10px;margin-top:20px;background:var(--panel,#fff);border:1px solid var(--line);box-shadow:0 8px 30px #0002;border-radius:16px;padding:14px}.catalog-cart-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}.catalog-empty{text-align:center;padding:40px 12px;color:var(--muted)}@media(max-width:600px){.catalog-wrap{padding:14px}.catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.catalog-card{padding:9px}.catalog-head{align-items:flex-start}}
</style></head><body><main class="catalog-wrap"><header class="catalog-head"><div class="catalog-brand"><div class="brand-mark">M</div><div><h1 id="storeName" style="margin:0">Katalog Produk</h1><p id="tagline" class="muted" style="margin:3px 0">Silakan pilih produk</p></div></div><span class="badge">Katalog Online</span></header><div class="catalog-toolbar"><input id="search" placeholder="Cari produk..."><select id="category"><option value="">Semua kategori</option></select></div><div id="catalog" class="catalog-grid"><div class="catalog-empty">Memuat katalog…</div></div><section class="catalog-cart"><h3 style="margin:0 0 8px">Pesanan Anda</h3><div id="cartRows" class="muted">Belum ada produk dipilih.</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><b>Total</b><strong id="total">Rp 0</strong></div><button class="primary full" id="order" disabled style="margin-top:12px">Pesan melalui WhatsApp</button></section><p class="muted" style="text-align:center;margin-top:20px">Pesanan dikonfirmasi langsung oleh toko melalui WhatsApp.</p></main><script type="module" src="js/catalog.js"></script></body></html>
