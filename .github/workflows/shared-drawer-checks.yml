name: Shared drawer static checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feat/shared-cash-drawer", "feat/owner-managed-job-invitations"]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in js/app.js js/cloud-sync.js js/device-pairing.js js/staff-accounts.js js/expenses.js js/pos.js js/stage4.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Install PostgreSQL parser
        run: python3 -m pip install --user pglast
      - name: Parse SQL syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          for path in ("supabase/schema.sql", "supabase/device-pairing.sql", "supabase/staff-accounts.sql", "supabase/shared-cash-drawer.sql", "supabase/shared-cash-drawer-confirmation-guard.sql", "supabase/owner-managed-staff-invitations.sql"):
              sql = Path(path).read_text()
              parse_sql(sql)
              print(f"PostgreSQL SQL syntax passed: {path}")
          PY
      - name: Test shared drawer source reconciliation
        run: node --test tests/shared-drawer-*.test.mjs
      - name: Check SQL function delimiters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          sql = Path("supabase/shared-cash-drawer.sql").read_text()
          opens = len(re.findall(r"\bas\s+\$\$", sql, re.I))
          closes = len(re.findall(r"\bend\s+\$\$\s*;", sql, re.I))
          assert opens == closes, f"Unbalanced PL/pgSQL delimiters: {opens} opens / {closes} closes"
          assert not re.search(r"\bas\s+\$(?:\s|$)", sql, re.I), "Malformed function opener"
          assert not re.search(r"\bend\s+\$\s*;", sql, re.I), "Malformed function closer"
          print(f"SQL delimiter check passed: {opens} function bodies")
          PY
