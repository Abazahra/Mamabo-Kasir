name: Deploy MAMBO KASIR ke GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate installable app icons\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y librsvg2-bin\n          rsvg-convert -w 192 -h 192 assets/mambo-app-icon.svg > assets/mambo-192.png\n          rsvg-convert -w 512 -h 512 assets/mambo-app-icon.svg > assets/mambo-512.png\n          rsvg-convert -w 180 -h 180 assets/mambo-app-icon.svg > assets/apple-touch-icon.png\n      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
