<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4b16c8"><meta name="application-name" content="MAMBO KASIR"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MAMBO KASIR"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>MAMBO KASIR</title><link rel="icon" type="image/svg+xml" href="./assets/mambo-app-icon.svg?v=brand-1"><link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png?v=brand-1"><link rel="manifest" href="./manifest.json?v=pwa-install-3"><link rel="stylesheet" href="styles.css?v=mambo-pos-photo-square-3"></head><body>
<div id="login" class="login-wrap"><section class="login-card"><img class="brand-mark" src="./assets/mambo-app-icon.svg?v=brand-1" alt="Logo MAMBO KASIR"><h1>MAMBO KASIR</h1><p class="muted">Masuk untuk mulai mengelola toko</p><label id="loginUsernameLabel">Username</label><input id="loginUsername" autocomplete="username" placeholder="Username karyawan"><label id="loginSecretLabel">Password / PIN</label><input id="loginPin" type="password" autocomplete="current-password" placeholder="Password atau PIN akun"><button id="loginBtn" class="primary full">Masuk</button><p id="loginError" class="error"></p><section class="owner-entry" style="margin-top:16px;text-align:left"><h3>Masuk sebagai Pemilik Toko</h3><p class="muted">Gunakan email dan password akun Owner Anda. Konfigurasi toko tersambung otomatis.</p><label>Email Owner</label><input id="ownerCloudEmail" type="email" autocomplete="username" placeholder="Email akun Owner"><label>Password</label><input id="ownerCloudPassword" type="password" autocomplete="current-password" placeholder="Password Owner"><button id="ownerCloudLoginBtn" class="primary full" type="button">Masuk sebagai Owner</button><p id="ownerCloudLoginError" class="error"></p><button id="inspectSyncQueueBtn" class="secondary full" type="button">Periksa Antrean Lokal (aman)</button><details style="margin-top:12px"><summary style="cursor:pointer">Belum punya akun? Daftar Owner baru</summary><label>Nama Toko</label><input id="ownerRegisterStore" placeholder="Nama toko"><label>Email</label><input id="ownerRegisterEmail" type="email" autocomplete="email" placeholder="Email aktif"><label>Password (minimal 8 karakter)</label><input id="ownerRegisterPassword" type="password" autocomplete="new-password" placeholder="Buat password"><button id="ownerRegisterBtn" class="secondary full" type="button">Daftar sebagai Owner</button><p id="ownerRegisterError" class="error"></p></details></section></section></div>
<div id="app" class="app hidden"><aside class="sidebar"><div class="side-brand"><img class="brand-mark small" src="./assets/mambo-app-icon.svg?v=brand-1" alt="Logo MAMBO KASIR"><div><b>MAMBO</b><small>KASIR</small></div></div><nav id="nav"><button data-page="dashboard" class="active">▦ Dashboard</button><button data-page="reports">▤ Laporan</button><button data-page="audit">◷ Audit Log</button><button data-page="pos">▣ Mesin Kasir</button><button data-page="transactions">▤ Riwayat Transaksi</button><button data-page="shift">▤ Shift & Laci Kas</button><button data-page="expenses">▤ Biaya Operasional</button><button data-page="purchasing">▧ Pembelian & Utang</button><button data-page="products">▣ Produk & Inventaris</button><button data-page="stock">⇄ Kartu Stok</button><button data-page="opname">☑ Stock Opname</button><button data-page="contacts">♙ Pelanggan & Supplier</button><button data-page="settings">⚙ Pengaturan</button><button data-page="staff">♙ Akun Karyawan</button></nav><div class="side-bottom"><div id="who"></div><button id="logout" class="ghost">Keluar ↗</button></div></aside>
<main class="main"><header class="topbar"><div><button id="menuToggle" class="icon-btn">☰</button><span id="pageTitle">Ringkasan</span><button id="profileBtn" class="secondary" type="button">Profil Saya</button></div><div class="top-actions"><span id="syncStatus" class="online" data-state="offline"><i></i> Offline</span><button id="themeToggle" class="icon-btn" title="Ganti tema">◐</button></div></header><div id="content" class="content"></div></main></div><div id="toast" class="toast"></div><script>
(function () {
  document.addEventListener('click', function (event) {
    var button = event.target && event.target.closest ? event.target.closest('#ownerCloudLoginBtn') : null;
    if (!button) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    var message = document.getElementById('ownerCloudLoginError');
    if (button.dataset.busy === '1') return;
    button.dataset.busy = '1';
    button.disabled = true;
    button.textContent = 'Menyiapkan login Owner…';
    if (message) message.textContent = 'Tombol terdeteksi. Memuat layanan login…';
    import('./js/owner-login-bridge.js?v=owner-login-queue-inspector-1')
      .then(function (module) { return module.loginOwner(button); })
      .catch(function (error) {
        console.error('Owner login loader:', error);
        if (message) message.textContent = 'Login belum dapat dijalankan: ' + (error && error.message ? error.message : 'Modul login gagal dimuat.');
        button.disabled = false;
        button.textContent = 'Masuk sebagai Owner';
        delete button.dataset.busy;
      });
  }, true);
})();
</script>
<script type="module" src="js/app.js?v=hide-from-pos-1"></script><script type="module" src="js/device-pairing.js?v=demo-cleanup-4"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(function(err){console.warn("Pendaftaran aplikasi:",err);});});}</script></body></html>
