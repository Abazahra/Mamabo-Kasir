<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>MAMBO KASIR — Tahap 1</title><link rel="stylesheet" href="styles.css?v=touch-nav-portrait-landscape-2"></head><body>
